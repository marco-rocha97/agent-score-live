[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-score-live"
version = "0.1.0"
description = "Camada de observabilidade de produção para agentes de IA"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "Marco Rocha", email = "marco.rocha97@gmail.com"},
]
license = {text = "MIT"}
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-ai>=0.1.0",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_score"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-v"
